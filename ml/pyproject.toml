[project]
name = "ml"
version = "0.1.0"
description = "THUCNews 字节级文本分类：训练 / 检查点评测 / 推理"
readme = "README.md"
authors = [
    { name = "TwoCreepers", email = "z15296529345@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.2",
    "fishetbl",
    "pytorch-lightning>=2.6.6",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "torchmetrics>=1.9.0",
    "triton-windows>=3.8.0.post29",
]

[project.scripts]
ml-train = "ml.train:train"
ml-test = "ml.test:main"
ml-infer = "ml.infer:infer"
ml-prepare-thucnews = "ml.preprocess:main"

[build-system]
requires = ["hatchling>=1.32.4,<1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
fishetbl = { workspace = true }
