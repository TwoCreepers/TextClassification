# THUCNews 字节级最小可行分类模型配置。
# 所有字段都可省略，省略时回落到 ml/src/ml/config.py 里的 dataclass 默认值。

[data]
# 预处理产物（uv run ml-prepare-thucnews）所在的根目录：
# root/dataset_info.json + root/packs/{split}.bin|.offsets.npy|.labels.npy。
root = "data/processed/THUCNews"
train_split = "train"
val_split = "val"
test_split = "test"
max_length = 512 # 每篇最多保留的 UTF-8 字节数，若 pad_to_max_length = false 则该配置无效
# 固定补齐到 max_length：batch 形状恒定，torch.compile 用静态形状只需编译一次；
# 改成 false 则按 batch 内最长序列补齐（变长），torch.compile 会自动改用动态形状。
pad_to_max_length = false
batch_size = 1024
num_workers = 0

[model]
# 架构：first_token（基线，只看第一个 token）或 byte_film（ByteFiLM-DenseNet）。
arch = "byte_film"
# byte 词表：token id 即字节值，0 号兼作 padding。
vocab_size = 256
# THUCNews 共 14 个分类（财经/彩票/房产/...），类别数由数据的分类目录决定。
num_classes = 14
bias = true
# 是否把 padding 位置挡在 attention 之外（变长文本必须开）。
use_padding_mask = true

[arch]
d_k = 16
d_v = 16
# mlp_k / mlp_v 的中间隐藏层宽度数组：如 [64, 128] 表示 d -> 64 -> 128 -> d；
# 空数组 [] 表示不加隐藏层（保持单层 d -> d）。
mlp_hidden = [32]
# 是否调制 V：true 时每轮 FiLM 调制 V 再逐位置 v_mix；false 则每轮直接复用静态 V
# （省掉每轮 film / v_mix 的参数）。
modulate_v = false
n_q = 16
d_block = 64
blocks_per_round = 2
rounds = 3
# 宽度压缩：每 compress_every_rounds 轮把主干宽度压到当前的 1/compress_denominator。
# 0 表示不压缩；目标宽度下限是 n_q*d_v，且最后一轮之后不压缩。
# denominator 可以是 int（所有压缩点共用）或数组（按压缩点顺序取，如 [2, 4]），
# 数组长度必须 >= 压缩点个数；取值 >= 1，填 1 表示该点不压缩（恒等映射）。
compress_every_rounds = 0
compress_denominator = 1
# 主干特征的四处 dropout，可分别配置（取值 [0, 1)，0 表示关闭）：
#   q_gen_dropout       送入 q_gen 之前
#   dense_block_dropout 送入每个 dense block 之前
#   film_dropout        作为条件特征送入 FiLM 之前（modulate_v = false 时不生效）
#   head_dropout        送入分类头之前（head_norm 之前）
q_gen_dropout = 0.1
dense_block_dropout = 0.1
film_dropout = 0.1
head_dropout = 0.1
attention_dropout = 0.3
# FiLM 初始化为恒等调制（gamma=1, beta=0）。
film_identity_init = true

[optim]
lr = 8e-3
weight_decay = 1e-5
# 标签平滑（nn.CrossEntropyLoss 的 label_smoothing）：0.0 关闭；常用 0.05 ~ 0.1。
# 打开后训练/验证 loss 的下界会抬高，不能和之前的曲线直接比数值。
label_smoothing = 0.1

[scheduler]
# 学习率调度：none（lr 恒定）或 cosine（余弦退火到 min_lr）。
name = "cosine"
# 前 warmup_epochs 个 epoch 线性升到 lr，之后再走余弦；0 表示不 warmup。
# 余弦周期 = max_epochs - warmup_epochs，必须小于 [trainer] max_epochs。
warmup_epochs = 5
# warmup 起点 lr = lr * warmup_start_factor。
warmup_start_factor = 0.1
# 余弦终点学习率（退火的最小值）。
min_lr = 1e-6

[ema]
# 启用 Lightning 自带的 EMA 权重平均（EMAWeightAveraging callback）：
# 验证 / 测试用平均后的权重，checkpoint 里存的也是 EMA 权重。
enabled = true
# 每步衰减系数：avg = decay * avg + (1 - decay) * new。
decay = 0.999
# false = 只平均参数，不动 buffer（如 BN 的 running stats）。
use_buffers = false

[logger]
# TensorBoard：日志与 checkpoint 都在 save_dir/name/version_* 下。
save_dir = "lightning_logs"
name = "byte_film"
log_graph = false

[trainer]
seed = 42
max_epochs = 100
accelerator = "auto"
devices = 1
# precision = "32-true"
precision = "bf16-mixed"
# torch.set_float32_matmul_precision（进程级全局设置）：high 让 fp32 矩阵乘走 TF32
#（Ampere+ 明显更快），highest 保持严格 fp32，medium 用 bf16 双乘更激进；仅 CUDA 生效。
float32_matmul_precision = "high"
log_every_n_steps = 50
limit_train_batches = 1.0
limit_val_batches = 1.0
limit_test_batches = 1.0

[compile]
# 是否启用 torch.compile（主模型 forward，fullgraph=True）。
enabled = true
fullgraph = true
# 动态形状不在这里配置：由 [data] pad_to_max_length 自动决定
# （固定补齐 -> 静态形状，一次编译；变长补齐 -> 动态形状，避免每个长度都重编译）。
# 编译自动求导 / 追踪 .item() 等标量输出。
compiled_autograd = true
capture_scalar_outputs = true
