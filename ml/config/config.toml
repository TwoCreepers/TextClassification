# THUCNews 字节级最小可行分类模型配置。
# 所有字段都可省略，省略时回落到 ml/src/ml/config.py 里的 dataclass 默认值。

[data]
# 预处理产物（just prep：纯 Python 8:1:1；just prep-dedup：.NET 先去重再 8:1:1）所在的根目录：
# root/dataset_info.json + root/packs/{split}.bin|.offsets.npy|.labels.npy。
root = "data/processed/THUCNews"
train_split = "train"
val_split = "val"
test_split = "test"
# 每篇最多保留的 UTF-8 字节数：数据集读取时先截断到这里，与 pad_to_max_length 无关。
# 填 -1 表示不截断（整篇喂给模型；长文很占显存，只在实验时用）。
max_length = 512
# 是否把 batch 补齐到 max_length（只影响补齐长度，不影响上面的截断）：
# 固定补齐时 batch 形状恒定，torch.compile 用静态形状只需编译一次；
# 改成 false 则只补到 batch 内最长序列（变长），torch.compile 会自动改用动态形状。
# max_length = -1（不截断）时没有固定长度可补，这一项不生效，一律变长补齐。
pad_to_max_length = false
batch_size = 1024
num_workers = 0

[model]
# 架构：first_token（基线，只看第一个 token）或 byte_film（ByteFiLM-DenseNet）。
arch = "byte_film"
# byte 词表：token id 即字节值，0 号兼作 padding。
vocab_size = 256
# THUCNews 共 14 个分类（财经/彩票/房产/...），类别数由数据的分类目录决定。
num_classes = 14
bias = true
# 是否把 padding 位置挡在 attention 之外（变长文本必须开）。
use_padding_mask = true

[arch]
d_k = 16
d_v = 16
# mlp_k / mlp_v 的中间隐藏层宽度数组：如 [64, 128] 表示 d -> 64 -> 128 -> d；
# 空数组 [] 表示不加隐藏层（保持单层 d -> d）。
mlp_hidden = [32]
# 是否调制 V：true 时每轮 FiLM 调制 V 再逐位置 v_mix；false 则每轮直接复用静态 V
# （省掉每轮 film / v_mix 的参数）。
modulate_v = false
n_q = 16
d_block = 64
blocks_per_round = 2
rounds = 3
# 宽度压缩：每 compress_every_rounds 轮把主干宽度压到当前的 1/compress_denominator。
# 0 表示不压缩；目标宽度下限是 n_q*d_v，且最后一轮之后不压缩。
# denominator 可以是 int（所有压缩点共用）或数组（按压缩点顺序取，如 [2, 4]），
# 数组长度必须 >= 压缩点个数；取值 >= 1，填 1 表示该点不压缩（恒等映射）。
compress_every_rounds = 0
compress_denominator = 1
# 主干特征的四处 dropout，可分别配置（取值 [0, 1)，0 表示关闭）：
#   q_gen_dropout       送入 q_gen 之前
#   dense_block_dropout 送入每个 dense block 之前
#   film_dropout        作为条件特征送入 FiLM 之前（modulate_v = false 时不生效）
#   head_dropout        送入分类头之前（head_norm 之前）
q_gen_dropout = 0
dense_block_dropout = 0
film_dropout = 0
head_dropout = 0
attention_dropout = 0.3
# FiLM 初始化为恒等调制（gamma=1, beta=0）。
film_identity_init = true
# mlp_k / mlp_v 之后各接一个残差卷积层（k、v 共用这一组配置）：
#   x + GELU(Norm(Conv(x)))，归一化位置跟随下面的 pre_norm、与 mlp 一致；
#   k 侧的卷积在 RoPE 之前。关闭时不建任何参数，state_dict 与不打开时完全一致，
#   已有 checkpoint 照常能载入；打开会新增参数，旧 checkpoint 需要重新训练。
# 卷积内部按 (B, C, 1, L) 用 2d 卷积实现（与 1d 卷积数学等价、逐元素误差 0），
# 因为 inductor 对 1d 卷积的反向会把序列长度固化成静态值：实测 20 个不同长度时，
# Conv1d 在第 9 个就撞 recompile_limit（fullgraph=True 直接失败），2d 实现 20/20 通过、
# 只编 3 张图。所以打开它不需要换 [compile] backend、也不需要 pad_to_max_length = true，
# 变长补齐 + inductor 照常可用；代价是卷积本身慢约一成（小通道数下以启动开销为主）。
kv_conv_enabled = true
# 卷积核长度 / 膨胀率，都必须 >= 1：kernel_size > 1 才有邻域感受野，dilation > 1 在不增加
# 参数量的前提下继续放大感受野。核长取奇数时 padding="same" 不必额外补零拷贝，最快。
kv_conv_kernel_size = 3
kv_conv_dilation = 3
# 是否预归一化（pre-norm）：true 时 mlp()（mlp_k / mlp_v / q_gen / v_mix）与上面的残差卷积
# 都改用 norm_pos = "before map"（先 RMSNorm 再映射），false 保持默认的 "after map"。
# 注意 pre_norm = true 会改变 norm 的通道数（q_gen 的 norm 从输出宽度变成输入宽度），
# 同样需要重新训练；dense_block / compress 本来就固定 pre-norm，不受这一项影响。
pre_norm = false

[optim]
lr = 8e-3
weight_decay = 1e-5
# 标签平滑（nn.CrossEntropyLoss 的 label_smoothing）：0.0 关闭；常用 0.05 ~ 0.1。
# 打开后训练/验证 loss 的下界会抬高，不能和之前的曲线直接比数值。
label_smoothing = 0.1

[scheduler]
# 学习率调度：none（lr 恒定）或 cosine（余弦退火到 min_lr）。
name = "cosine"
# 前 warmup_epochs 个 epoch 线性升到 lr，之后再走余弦；0 表示不 warmup。
# 余弦周期 = max_epochs - warmup_epochs，必须小于 [trainer] max_epochs。
warmup_epochs = 5
# warmup 起点 lr = lr * warmup_start_factor。
warmup_start_factor = 0.1
# 余弦终点学习率（退火的最小值）。
min_lr = 1e-6

[ema]
# 启用 Lightning 自带的 EMA 权重平均（EMAWeightAveraging callback）：
# 验证 / 测试用平均后的权重，checkpoint 里存的也是 EMA 权重。
enabled = true
# 每步衰减系数：avg = decay * avg + (1 - decay) * new。
decay = 0.999
# false = 只平均参数，不动 buffer（如 BN 的 running stats）。
use_buffers = false

[early_stopping]
# 是否启用早停（Lightning 的 EarlyStopping callback）。代码里的默认值是关闭，这份配置打开它：
# 只省掉收敛之后的 epoch，不会改变 best.ckpt 的内容。
enabled = true
# 监控的指标：与 best.ckpt 用同一个（val/f1_macro），这样"停在哪"和"存了哪个"是一致的。
# 不要改成 val/loss 却留在 max：val/loss 是越小越好，方向弄反就永不触发（或立刻触发）。
monitor = "val/f1_macro"
mode = "max"
# 连续多少个 epoch 没提升就停。取 10 的依据是 lightning_logs/byte_film/version_0 的真实曲线：
# 63 个 epoch（0..62）里，val/f1_macro 的最优值出现在 epoch 37（0.9016），而两次真实提升
# 之间的最长间隔只有 3 个 epoch（epoch 31 -> 34，中间 32/33 都在抖），10 是该间隔的 3 倍多，
# 足够穿过噪声、又不会白白多跑。按那条曲线，patience = 10 会在 epoch 47 触发（37 + 10），
# 比手工跑到 63 省 16 个 epoch，比 max_epochs = 100 省掉一半以上。
patience = 10
# 提升小于这个量就不算提升，用来滤掉验证集抖动。真实曲线在平台段（epoch >= 26）逐 epoch 的
# |Δf1| 中位数是 2.8e-4、最大 1.2e-3，所以 1e-4 低于噪声、能把抖动挡在外面；
# 不要加到 1e-3：那会把 epoch 31~37 之间 3e-4 ~ 5e-4 的真实小提升也算成"没提升"，
# 于是在 epoch 31 就误停，丢掉 0.0009 的 f1。
min_delta = 1e-4
# 注意与 [scheduler] cosine 的相互作用：余弦周期按 [trainer] max_epochs 算，若早停在 epoch 47
# 触发，lr 只从 8e-3 退火到约 4.8e-3，最后那段低 lr 精调等于没跑。真实曲线在 epoch 35 之后
# 验证 loss 单调抬升（0.7506 -> 0.7570），说明高 lr 下已无收益；若想让退火完整跑完，
# 把 [trainer] max_epochs 调到 50 左右，让早停退化成保险丝而不是主开关。

[logger]
# TensorBoard：日志与 checkpoint 都在 save_dir/name/version_* 下。
save_dir = "lightning_logs"
name = "byte_film"
log_graph = false

[trainer]
seed = 42
max_epochs = 50
accelerator = "auto"
devices = 1
# precision = "32-true"
precision = "bf16-mixed"
# torch.set_float32_matmul_precision（进程级全局设置）：high 让 fp32 矩阵乘走 TF32
#（Ampere+ 明显更快），highest 保持严格 fp32，medium 用 bf16 双乘更激进；仅 CUDA 生效。
float32_matmul_precision = "high"
log_every_n_steps = 50
limit_train_batches = 1.0
limit_val_batches = 1.0
limit_test_batches = 1.0

[compile]
# 是否启用 torch.compile（主模型 forward，fullgraph=True）。
enabled = true
# 编译引擎（torch.compile 的 backend）：
#   "inductor"  - 默认，真正生成 Triton / C++ kernel（最快）；需要 C++ 编译器，
#                 Windows 上要能找到 cl.exe（VS 的 x64 Native Tools 命令行里就有）。
#   "aot_eager" - 走 dynamo + AOTAutograd，但算子仍用 eager 实现；不需要 C++ 编译器，
#                 常用来确认「图能不能编」，也用来绕开 inductor 在 1d 卷积之类算子上的毛病。
#   "eager"     - dynamo 只捕获图、直接按 eager 执行，最省事的兜底。
# 也接受 torch 认识的其他名字（如 "cudagraphs"）；拼错时启动阶段就会报错并列出可选值。
backend = "inductor"
fullgraph = true
# 动态形状不在这里配置：由 [data] pad_to_max_length 自动决定
# （固定补齐 -> 静态形状，一次编译；变长补齐 -> 动态形状，避免每个长度都重编译）。
# 编译自动求导 / 追踪 .item() 等标量输出。
compiled_autograd = true
capture_scalar_outputs = true
