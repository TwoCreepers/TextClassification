[project]
name = "fishetbl"
dynamic = ["version"]
description = "Fish's torch base lib"
readme = "README.md"
authors = [
    { name = "TwoCreepers", email = "z15296529345@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "torch>=2.14.1",
]

[build-system]
requires = ["hatchling>=1.32.4,<1.33.0"]
build-backend = "hatchling.build"

# 版本号唯一来源：src/fishetbl/version.py 里的 __version__。
[tool.hatch.version]
path = "src/fishetbl/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fishetbl"]
